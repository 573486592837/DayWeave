<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>DayWeave</title>
    <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/login.css" />
  </head>
  <body>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <main class="login-card" id="card" aria-busy="true">
      <div class="brand">
        <img src="/assets/img/logo.svg" alt="" width="40" height="40" />
        <span>DayWeave</span>
      </div>
      <p class="subtitle" id="subtitle"></p>

      <form id="form" novalidate>
        <div class="field-group" id="passwordGroup">
          <label for="password" id="passwordLabel"></label>
          <div class="field">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              autocapitalize="off"
              spellcheck="false"
              required
            />
            <button type="button" class="peek" id="peek" aria-label="show password"></button>
          </div>
        </div>

        <div class="field-group" id="confirmGroup" hidden>
          <label for="confirm" id="confirmLabel"></label>
          <div class="field">
            <input
              id="confirm"
              name="confirm"
              type="password"
              autocomplete="new-password"
              autocapitalize="off"
              spellcheck="false"
            />
          </div>
        </div>

        <p class="error" id="error" role="alert"></p>
        <button type="submit" class="primary" id="submit" disabled></button>
      </form>

      <div class="foot">
        <span class="hint" id="hint"></span>
        <button type="button" class="link" id="langToggle">English</button>
      </div>
    </main>
    <script type="module" src="/assets/js/login.js"></script>
  </body>
</html>
