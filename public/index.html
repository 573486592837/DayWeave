<!doctype html>
<html lang="zh-CN" data-theme="midnight">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>DayWeave</title>
    <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/themes.css" />
    <link rel="stylesheet" href="/assets/css/widgets.css" />
    <link rel="stylesheet" href="/assets/css/editor.css" />
    <link rel="stylesheet" href="/assets/css/mobile.css" />
  </head>
  <body>
    <div id="bg-layer" aria-hidden="true"></div>
    <div id="bg-overlay" aria-hidden="true"></div>

    <div class="app" id="app">
      <header class="toolbar" id="toolbar"></header>
      <nav class="mobile-tabs" id="mobile-tabs" aria-label="view"></nav>
      <main class="canvas" id="canvas" aria-label="DayWeave"></main>
    </div>

    <aside class="inspector" id="inspector" aria-hidden="true" aria-label="properties"></aside>

    <button class="btn display-exit" id="display-exit" type="button">
      <span class="btn-ico">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </span>
      <span id="display-exit-label">退出展示</span>
    </button>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <div class="splash" id="splash">
      <div class="splash-inner">
        <div class="brand">
          <img src="/assets/img/logo.svg" alt="" width="38" height="38" />
          <span>DayWeave</span>
        </div>
        <div class="spinner" role="status" aria-label="loading"></div>
      </div>
    </div>

    <noscript>DayWeave requires JavaScript.</noscript>
    <script type="module" src="/assets/js/app.js"></script>
  </body>
</html>
